[package]
name = "brass-poolrooms-web-floor-forge"
version = "0.0.0"
edition = "2024"
rust-version = "1.96"
publish = false

[workspace]

[dependencies]
anyhow = "=1.0.104"
pollster = "=1.0.1"
wgpu = { version = "=30.0.0", default-features = false, features = ["gles", "std", "wgsl"] }

[lints.rust]
unsafe_code = "deny"
warnings = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
missing_errors_doc = "allow"
