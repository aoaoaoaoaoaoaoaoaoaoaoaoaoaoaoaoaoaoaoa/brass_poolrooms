<!doctype html>
<html lang="en" data-poolrooms="booting">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0c0b09">
    <meta
      name="description"
      content="Native-scale WGPU configurator for Brass Poolrooms metals, lighting, die topologies, hardware coupons, and monoglyph gauges."
    >
    <title>Poolrooms · Foundry Optics Atelier</title>
    <style>
      html,
      body {
        min-width: 1180px;
        min-height: 900px;
        margin: 0;
        overflow: auto;
        background: #0c0b09;
      }

      body {
        display: grid;
        place-items: start center;
      }

      #poolrooms {
        display: block;
        width: 1180px;
        height: 900px;
        outline: none;
        touch-action: none;
      }

      #status {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        color: #a98556;
        background: #0c0b09;
        font: 12px/1.5 ui-monospace, monospace;
        letter-spacing: 0.12em;
        transition: opacity 180ms ease;
        pointer-events: none;
      }

      html[data-poolrooms="ready"] #status {
        opacity: 0;
      }

      html[data-poolrooms="failed"] #status {
        color: #d29a72;
        padding: 2rem;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <canvas
      id="poolrooms"
      width="1180"
      height="900"
      aria-label="Foundry Optics Atelier"
    ></canvas>
    <div id="status" role="status">FORGING NATIVE-SCALE WGPU STUDIES</div>
    <noscript>This atelier requires JavaScript and WebGPU.</noscript>
    <script type="module" src="./boot.js"></script>
  </body>
</html>
