schema = 1

[product]
name = "brass_poolrooms"
package = "brass_poolrooms"
profile = "rust-library"

[coordinates]
release-tested = [
  "linux-x86_64",
  "macos-aarch64",
  "macos-x86_64",
  "windows-x86_64",
]

[[proofs]]
name = "source"
laws = ["source"]
run = ["scripts/check-foundry"]
timeout-minutes = 60

[[proofs]]
name = "security"
laws = ["security"]
run = ["scripts/audit"]
timeout-minutes = 15

[[proofs]]
name = "source-package"
laws = ["source-package"]
run = ["cargo", "package", "--locked"]
timeout-minutes = 30

[[proofs]]
name = "host"
laws = ["host"]
run = ["cargo", "test", "--locked", "--workspace", "--all-targets", "--all-features"]
coordinates = [
  "linux-x86_64",
  "macos-aarch64",
  "macos-x86_64",
  "windows-x86_64",
]
timeout-minutes = 45
