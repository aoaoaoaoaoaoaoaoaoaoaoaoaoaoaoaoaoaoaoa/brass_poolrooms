schema = 1

[product]
name = "brass_poolrooms"
package = "brass_poolrooms"
profile = "rust-library"

[coordinates]
release-tested = [
  "linux-x86_64",
  "macos-aarch64",
  "macos-x86_64",
  "windows-x86_64",
]

[[proofs]]
name = "source"
laws = ["source", "demonstration"]
run = ["scripts/check-foundry"]
timeout-minutes = 60

[[proofs]]
name = "host"
laws = ["host"]
coordinates = [
  "linux-x86_64",
  "macos-aarch64",
  "macos-x86_64",
  "windows-x86_64",
]
timeout-minutes = 45
